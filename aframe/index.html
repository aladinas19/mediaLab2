<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lab2 - VR application</title>

    <meta name="description" content="Basic example for Point Cloud component."></meta>

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-pointcloud-component@0.4.0/dist/aframe-pointcloud-component.min.js"></script>
  </head>
  <body>

    <a-scene>

      <a-plane rotation="-90 0 0" height="100" width="100" color="#1f3b4d"></a-plane>

      <a-light type="ambient" color="#445451"></a-light>
      <a-light type="point" intensity="2" position="2 4 4"></a-light>

      <a-sky color="#0b1d2a"></a-sky>

      <a-entity laser-controls></a-entity>

      <a-pointcloud id="model"
          scale="0.5 0.5 0.5" 
          position="0 1 -3" 
          src="url(Sphere.ply)" 
          size="0.05"
          texture="url(VGTU-logo.png)"
          depthWrite="false">
      </a-pointcloud>

    </a-scene>

<div class="ui">
      <div>
  <button id="rotLeft">Sukti kairėn</button>
  <button id="rotRight">Sukti dešinėn</button>
      </div>
    <div>
      <button id="moveForward">Pirmyn</button>
      <button id="moveBack">Atgal</button>
      <button id="moveLeft">Kairėn</button>
      <button id="moveRight">Dešinėn</button>
    </div>
</div>

<script src="js/controls.js"></script>

  </body>
</html>
