<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Lab2 - VR application</title>

  <meta name="description" content="Basic example for Point Cloud component.">

  <link rel="stylesheet" href="style.css">

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-pointcloud-component@0.4.0/dist/aframe-pointcloud-component.min.js"></script>

</head>

<body>

  <a-scene>

    <a-assets>
      <img id="vgtuLogo" src="VGTU-logo.png">
    </a-assets> 

    <a-image
      src="#vgtuLogo"
      position="0 5 -21"
      width="3"
      height="2">
    </a-image>  

    <a-entity 
      camera 
      position="0 1.6 0"  
      look-controls
      wasd-controls
      cursor="rayOrigin: mouse">
    </a-entity>

    <a-plane
      rotation="-90 0 0"
      height="100"
      width="100"
      color="#1f3b4d">
    </a-plane>

    <a-light type="ambient" color="#ffffff"></a-light>

    <a-light
      type="point"
      intensity="2"
      position="2 4 4">
    </a-light>

    <a-sky color="#0b1d2a"></a-sky>

    <a-entity laser-controls></a-entity>

    <a-box
      id="model"
      class="clickable"
      position="1 1 -2"
      rotation="0 45 0"
      src="vgtu-logo.png"
      >
    </a-box>
  </a-scene>


  <div class="ui">

    <div>
      <button id="rotLeft">Sukti kairėn</button>
      <button id="rotRight">Sukti dešinėn</button>
    </div>

    <div>
      <button id="moveForward">Pirmyn</button>
      <button id="moveBack">Atgal</button>
      <button id="moveLeft">Kairėn</button>
      <button id="moveRight">Dešinėn</button>
    </div>

    <div>
      <button id="scaleUp">Padidinti</button>
      <button id="scaleDown">Sumažinti</button>
    </div>

  </div>


  <script src="js/control.js"></script>

</body>
</html>
